<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>舊帳號救援</title>
<style>body{font-family:system-ui;background:#f5f7fb;color:#26354b}main{max-width:720px;margin:30px auto;padding:18px}.card{background:#fff;border:1px solid #e4e8ee;border-radius:18px;padding:20px;margin:15px 0}label{display:block;font-weight:800;margin:12px 0}input{width:100%;padding:11px;border:1px solid #ccd4de;border-radius:10px}button,a{border:0;border-radius:10px;padding:10px 14px;font-weight:900;text-decoration:none;display:inline-block;margin:3px}.p{background:#485975;color:#fff}.s{background:#edf0f5;color:#435069}.w{background:#fff0e8;color:#9b4c14}.hidden{display:none}.msg{white-space:pre-wrap;background:#f6f8fb;padding:12px;border-radius:12px}</style>
<script src="shared/firebase-config.js?v=16"></script></head><body><main><a class="s" href="teacher.html">← 教師端</a><a class="s" href="teacher-audit.html">🔎 異常檢查</a>
<section id="login" class="card"><h1>🔑 舊帳號救援</h1><label>Email<input id="email"></label><label>密碼<input id="password" type="password"></label><button id="loginBtn" class="p">教師登入</button><div id="loginMsg"></div></section>
<section id="app" class="card hidden"><h2>學生資料</h2><label>班級<input id="cls" placeholder="910"></label><label>座號<input id="seat" placeholder="30"></label><label>姓名<input id="name"></label><button id="inspectBtn" class="s">先檢查舊紀錄</button><div id="inspect" class="msg">尚未檢查</div>
<h3>設定新臨時密碼</h3><label>新密碼<input id="newPassword" type="password" minlength="6"></label><button id="rescueBtn" class="w">確認救援並合併進度</button><div id="result" class="msg"></div></section>
<script src="shared/teacher-rescue.js?v=16"></script></main></body></html>
