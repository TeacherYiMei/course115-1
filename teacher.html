<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Python 學習進度｜教師端</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;background:#f4f7fb;color:#24324a}
header{background:#fff;border-bottom:1px solid #e2e6eb;padding:16px max(18px,calc((100vw - 1180px)/2));display:flex;justify-content:space-between;align-items:center}
main{max-width:1180px;margin:auto;padding:20px}.card{background:white;border-radius:18px;padding:20px;box-shadow:0 8px 28px #34475b10;margin-bottom:16px}
.login{max-width:480px;margin:50px auto}.field{display:block;margin:12px 0}.field input{width:100%;padding:11px;border:1px solid #ccd4de;border-radius:10px}
button,select{font:inherit}button{border:0;border-radius:11px;padding:10px 14px;font-weight:900;cursor:pointer}.primary{background:#4f59c7;color:white}.soft{background:#e9ecf2;color:#475466}.export{background:#e4f7eb;color:#267148}.auditLink{display:inline-flex;align-items:center;text-decoration:none;background:#fff3d6;color:#805d0d;border-radius:11px;padding:10px 14px;font-weight:900}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.toolbar select{padding:9px 12px;border:1px solid #ccd4de;border-radius:10px}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.metric{background:#f7f8fb;border-radius:14px;padding:14px}.metric b{display:block;font-size:25px}
table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #e8ebef;text-align:left;font-size:14px}th{background:#f7f8fb;position:sticky;top:0}.tableWrap{overflow:auto;max-height:65vh}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef1f5}.done{background:#e4f7eb;color:#267148}.hidden{display:none!important}.error{color:#b43b3b;font-weight:800}.status{font-size:13px;color:#687385}
.manageBtn{background:#eef1f5;color:#364152;padding:7px 10px;white-space:nowrap}
dialog.manageDialog{width:min(720px,calc(100% - 28px));border:0;border-radius:18px;padding:0;box-shadow:0 20px 60px #21304735}
dialog.manageDialog::backdrop{background:#22314a80}
.manageHead{padding:18px 20px;border-bottom:1px solid #e8ebef}.manageBody{padding:18px 20px}.recordList{display:grid;gap:10px;margin:14px 0}
.recordCard{display:flex;justify-content:space-between;gap:14px;align-items:center;border:1px solid #e2e6eb;border-radius:14px;padding:13px}
.recordInfo{display:flex;gap:8px 14px;flex-wrap:wrap;align-items:center;min-width:0}.danger{background:#fdebec;color:#a12f35}
.manageFooter{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:0 20px 18px}.warn{color:#9a5b19;font-size:13px}
@media(max-width:700px){.recordCard{align-items:stretch;flex-direction:column}.deleteRecordBtn{width:100%}}
@media(max-width:700px){.summary{grid-template-columns:repeat(2,1fr)}}
</style>
<style>
  /* v13.1：維護欄固定可見 */
  table{width:100%; table-layout:auto}
  th,td{white-space:nowrap}
  th.maintainCol,td.maintainCol{
    min-width:96px;
    width:96px;
  }
  .manageBtn{
    display:inline-flex !important;
    align-items:center;
    justify-content:center;
    min-width:84px;
    min-height:36px;
    padding:7px 10px;
    visibility:visible !important;
    opacity:1 !important;
  }
  .tableWrap{
    overflow-x:auto !important;
  }
  @media(max-width:900px){
    th:nth-child(7),td:nth-child(7){max-width:220px;white-space:normal}
  }
</style>


<style>
  .recordActions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  .warningBtn{background:#fff4df;color:#8a5a12}
  .adminForm{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .adminForm label{font-size:13px;color:#687385;font-weight:700}
  .adminForm input{width:100%;box-sizing:border-box;margin-top:5px;padding:10px 12px;border:1px solid #cfd6df;border-radius:10px;font-size:16px}
  .adminForm .full{grid-column:1/-1}
  .dialogError{color:#b43b3b;font-weight:700;margin-top:10px}
  .dialogWarning{background:#fff8e8;color:#6e531f;border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.55;margin-top:12px}
  .progressTable{width:100%;border-collapse:collapse;margin-top:12px}
  .progressTable th,.progressTable td{padding:8px 10px;border-bottom:1px solid #e8ebef;text-align:left}
  @media(max-width:650px){.adminForm{grid-template-columns:1fr}.adminForm .full{grid-column:auto}.recordActions{justify-content:stretch}.recordActions button{flex:1 1 45%}}
</style>

</head>
<body>
<header><div><b>👩‍🏫 Python 學習進度｜教師端</b><div class="status">教師端與學生闖關頁分離</div><div class="status" style="font-weight:800">版本：v15 教師異常檢查版</div><div id="teacherIdentity" class="status"></div></div><button id="logoutBtn" class="soft hidden">登出</button></header>
<main>
<section id="loginCard" class="card login">
<h1>教師登入</h1><p>請使用 Firebase Authentication 中建立的教師帳號。</p>
<label class="field">Email<input id="email" type="email"></label>
<label class="field">密碼<input id="password" type="password"></label>
<div id="loginError" class="error"></div><button id="loginBtn" class="primary">登入教師端</button>
</section>
<section id="dashboard" class="hidden">
<div class="card">
<div class="toolbar"><b>授權班級：</b><select id="classFilter"><option value="">全部班級</option></select>
<button id="refreshBtn" class="soft">重新整理</button><button id="exportBtn" class="export">📗 下載此班 Excel</button><a class="auditLink" href="teacher-audit.html">🔎 異常檢查</a><span id="dbStatus" class="status"></span></div>
<div class="summary"><div class="metric">學生人數<b id="studentCount">0</b></div><div class="metric">平均星星<b id="avgStars">0</b></div><div class="metric">平均評分<b id="avgScore">0</b></div><div class="metric">完成人數<b id="doneCount">0</b></div></div>
</div>
<div class="card tableWrap"><table><thead><tr><th>班級</th><th>座號</th><th>姓名</th><th class="maintainCol">維護</th><th>星星</th><th>評分</th><th>目前進度</th><th>完成</th><th>最近更新</th><th>紀錄</th></tr></thead><tbody id="rows"></tbody></table></div>
</section></main>


<dialog id="progressDetailDialog" class="manageDialog">
  <div class="manageHead">
    <h2 style="margin:0 0 6px">📊 Python 關卡明細</h2>
    <div id="detailTitle"></div>
  </div>
  <div class="manageBody">
    <div id="progressDetailSummary" class="status"></div>
    <table class="progressTable">
      <thead><tr><th>關卡</th><th>完成挑戰</th><th>狀態</th></tr></thead>
      <tbody id="progressDetailBody"></tbody>
    </table>
  </div>
  <div class="manageFooter">
    <span></span>
    <button id="closeDetailBtn" class="soft" type="button">關閉</button>
  </div>
</dialog>

<dialog id="editRecordDialog" class="manageDialog">
  <div class="manageHead">
    <h2 style="margin:0 0 6px">✏️ 更正學生資料</h2>
    <div class="status">只能維護自己被授權的班級。</div>
  </div>
  <div class="manageBody">
    <input id="editDocId" type="hidden">
    <input id="editOriginalClass" type="hidden">
    <div class="adminForm">
      <label>班級
        <input id="editClassName" inputmode="numeric" maxlength="3">
      </label>
      <label>座號
        <input id="editSeatNo" inputmode="numeric" maxlength="2">
      </label>
      <label class="full">姓名
        <input id="editStudentName" maxlength="20">
      </label>
    </div>
    <div id="editAccountWarning" class="dialogWarning"></div>
    <div id="editRecordError" class="dialogError"></div>
  </div>
  <div class="manageFooter">
    <button id="closeEditBtn" class="soft" type="button">取消</button>
    <button id="saveEditBtn" type="button">儲存更正</button>
  </div>
</dialog>

<dialog id="studentManageDialog" class="manageDialog">
  <div class="manageHead">
    <h2 style="margin:0 0 6px">🛠️ 學生資料維護</h2>
    <div id="manageStudentTitle"></div>
  </div>
  <div class="manageBody">
    <p id="manageStudentNote" class="status"></p>
    <div class="warn">⚠️ 請只刪除確認輸入錯誤或重複的紀錄。刪除 Firestore 學習紀錄不會自動刪除 Firebase Authentication 的登入帳號。</div>
    <div id="manageRecordList" class="recordList"></div>
  </div>
  <div class="manageFooter">
    <span id="manageDeleteStatus" class="status"></span>
    <button id="closeManageBtn" class="soft" type="button">關閉</button>
  </div>
</dialog>
<script src="shared/firebase-config.js?v=14"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script src="shared/teacher-dashboard.js?v=14"></script>
</body></html>
